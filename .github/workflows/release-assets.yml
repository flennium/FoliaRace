name: Publish GitHub release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to receive the assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release artifacts
        run: ./gradlew release --no-daemon
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(
            find build/release foliarace-plugin/build/libs foliarace-agent/build/libs -maxdepth 1 -type f \
              \( -name 'FoliaRace-*.zip' -o -name 'FoliaRace-*.zip.sha256' \
              -o -name 'foliarace-plugin-*.jar' -o -name 'foliarace-agent-*.jar' \) \
              ! -name '*sources.jar' | sort
          )
          test "${#assets[@]}" -gt 0
          printf 'Uploading:\n%s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
