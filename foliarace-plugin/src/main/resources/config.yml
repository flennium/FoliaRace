enabled-detectors:
  - cross-region-ownership
  - cross-entity-ownership
  - async-server-state-access
  - scheduler-misuse

overhead-mode: standard
max-session-duration-seconds: 900
minimum-severity: info
minimum-confidence: informational
observation-queue-capacity: 8192
sampling-rate: 1.0
output-formats:
  - json
production-mode: false
production-acknowledged: false
suppression-file: suppressions.yml
baseline-file: baseline.json
ci-mode: false
require-instrumentation: false
